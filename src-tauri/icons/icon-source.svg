<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="r"><rect width="1024" height="1024" rx="120"/></clipPath>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454952"/><stop offset="0.5" stop-color="#2c2f35"/><stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/><stop offset="1" stop-color="#d9620c"/>
    </linearGradient>
    <radialGradient id="rad" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#5d616a"/><stop offset="1" stop-color="#1c1d21"/>
    </radialGradient>
    <pattern id="grille" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3" fill="#0e0f11" opacity="0.6"/>
    </pattern>
    <clipPath id="bodyclip"><rect x="200" y="392" width="624" height="240" rx="120"/></clipPath>
  </defs>
  <!-- checkerboard -->
  <g clip-path="url(#r)">
    <rect width="1024" height="1024" fill="#fdd59b"/>
    <rect width="512" height="512" fill="#8a4c40"/>
    <rect x="512" y="512" width="512" height="512" fill="#8a4c40"/>
  </g>
  <g transform="translate(0 50)">
  <!-- sound waves -->
  <g fill="none" stroke="#f58220" stroke-width="28" stroke-linecap="round">
    <path d="M420 300 Q512 250 604 300"/>
    <path d="M360 236 Q512 160 664 236" opacity="0.7"/>
  </g>
  <!-- shadow -->
  <ellipse cx="512" cy="660" rx="400" ry="26" fill="#000" opacity="0.28"/>
  <!-- left cap -->
  <rect x="96" y="380" width="230" height="264" rx="132" fill="url(#cap)" stroke="#111" stroke-width="12"/>
  <!-- right cap -->
  <rect x="698" y="380" width="230" height="264" rx="132" fill="url(#cap)" stroke="#111" stroke-width="12"/>
  <!-- body (fabric) -->
  <rect x="200" y="392" width="624" height="240" rx="0" fill="url(#body)" stroke="#111" stroke-width="12"/>
  <rect x="200" y="392" width="624" height="240" fill="url(#grille)"/>
  <!-- seams -->
  <line x1="200" y1="392" x2="200" y2="632" stroke="#111" stroke-width="12"/>
  <line x1="824" y1="392" x2="824" y2="632" stroke="#111" stroke-width="12"/>
  <!-- top buttons -->
  <g fill="#f58220" stroke="#111" stroke-width="6">
    <rect x="404" y="404" width="56" height="20" rx="10"/>
    <rect x="484" y="404" width="56" height="20" rx="10"/>
    <rect x="564" y="404" width="56" height="20" rx="10"/>
  </g>
  <!-- passive radiators on ends -->
  <g>
    <ellipse cx="160" cy="512" rx="44" ry="96" fill="url(#rad)" stroke="#111" stroke-width="8"/>
    <ellipse cx="160" cy="512" rx="18" ry="40" fill="#f58220" opacity="0.9"/>
    <ellipse cx="864" cy="512" rx="44" ry="96" fill="url(#rad)" stroke="#111" stroke-width="8"/>
    <ellipse cx="864" cy="512" rx="18" ry="40" fill="#f58220" opacity="0.9"/>
  </g>
  <!-- highlight -->
  <path d="M220 440 L804 440" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.14"/>
  </g>
  <!-- outer subtle border -->
  <rect x="3" y="3" width="1018" height="1018" rx="117" fill="none" stroke="#6b3a30" stroke-width="6" opacity="0.35"/>
</svg>
