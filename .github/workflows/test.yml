name: Test
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint:ci

      - name: Run tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The DuckDB extension is only bundled as a resource and the frontend is
      # only embedded; the Rust tests need neither, but the build checks both exist.
      - name: Placeholders for the aix extension and the frontend
        run: |
          touch aixchess.duckdb_extension
          mkdir -p dist
          echo '<!doctype html><title>JBLBase</title>' > dist/index.html

      - name: Run Rust tests
        working-directory: src-tauri
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo test
