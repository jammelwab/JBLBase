name: Build installers

# Unsigned test builds on every push to main (no updater artifacts).
# Official versions with in-app updates come from the Release workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
            aix_target: windows_amd64
            artifact: JBLBase-windows
            path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            aix_target: osx_arm64
            artifact: JBLBase-macos-arm64
            path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          AIX_EXTENSION_TARGET: ${{ matrix.aix_target }}
          AIX_EXTENSION_FORCE_DOWNLOAD: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
        shell: bash
        run: pnpm tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check macOS signature allows the bundled DuckDB extension
        if: matrix.platform == 'macos-latest'
        run: |
          dmg=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/jbl "$dmg" >/dev/null
          codesign -dv /tmp/jbl/JBLBase.app 2>&1 | grep -E "flags|TeamIdentifier"
          codesign -d --entitlements - /tmp/jbl/JBLBase.app 2>&1 | tee /tmp/ent.txt
          hdiutil detach /tmp/jbl >/dev/null
          grep -q "disable-library-validation" /tmp/ent.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
