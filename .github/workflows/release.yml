name: Release

# Builds signed installers for a GitHub release: either when a release is
# published on GitHub, or by starting this workflow by hand with a tag (the
# release is then created). The app's built-in updater reads latest.json from
# the newest release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1 (created if missing)"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # A manual run creates the release as a draft first, so both platform
  # builds upload into the same release. It is published only after both
  # builds succeeded; until then the previous release stays "latest" and the
  # in-app update check keeps working.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Find or create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
        run: |
          if [ -n "$EVENT_RELEASE_ID" ]; then
            echo "id=$EVENT_RELEASE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$TAG\")) | .[0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="JBLBase ${TAG#v}" -F draft=true \
              -f body="Download for Windows: the \`.exe\` file. For Mac (Apple Silicon): the \`.dmg\` file. Already installed? Use \"Check for updates\" in the app." \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            aix_target: osx_arm64
          - platform: windows-latest
            args: "--bundles nsis"
            aix_target: windows_amd64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIX_EXTENSION_TARGET: ${{ matrix.aix_target }}
          AIX_EXTENSION_FORCE_DOWNLOAD: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Measurement Protocol secret of the usage statistics (optional;
          # without it the statistics stay off in this build).
          VITE_GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
          CI: false
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "JBLBase __VERSION__"
          releaseBody: |
            Download for Windows: the `.exe` file. For Mac (Apple Silicon): the `.dmg` file.
            Already installed? Use "Check for updates" in the app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.prepare.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true
