name: Release

# Builds signed installers for a GitHub release: either when a release is
# published on GitHub, or by starting this workflow by hand with a tag (the
# release is then created). The app's built-in updater reads latest.json from
# the newest release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1 (created if missing)"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # A manual run for a new tag creates the release first, so both
  # platform builds upload into the same release.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if missing
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "JBLBase ${TAG#v}" --notes "Download for Windows: the \`.exe\` file. For Mac (Apple Silicon): the \`.dmg\` file. Already installed? Use \"Check for updates\" in the app."
          fi

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            aix_target: osx_arm64
          - platform: windows-latest
            args: "--bundles nsis"
            aix_target: windows_amd64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIX_EXTENSION_TARGET: ${{ matrix.aix_target }}
          AIX_EXTENSION_FORCE_DOWNLOAD: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: false
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "JBLBase __VERSION__"
          releaseBody: |
            Download for Windows: the `.exe` file. For Mac (Apple Silicon): the `.dmg` file.
            Already installed? Use "Check for updates" in the app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
