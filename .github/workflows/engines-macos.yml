name: Build Patricia (macOS)

# Builds the unmodified upstream source of the Patricia chess engine
# (https://github.com/Adam-Kulju/Patricia, MIT license) for Apple Silicon,
# because upstream only publishes Windows and Linux binaries.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Patricia tag or commit"
        default: "5.1"
  push:
    branches: [main]
    paths:
      - .github/workflows/engines-macos.yml

env:
  PATRICIA_REF: ${{ inputs.ref || '5.1' }}

jobs:
  patricia:
    runs-on: macos-latest
    steps:
      - name: Fetch Patricia source
        run: |
          git clone https://github.com/Adam-Kulju/Patricia.git patricia
          git -C patricia checkout "$PATRICIA_REF"
          echo "COMMIT=$(git -C patricia rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Compile (Apple Silicon)
        working-directory: patricia/engine
        run: |
          clang++ src/patricia.cpp src/fathom/src/tbprobe.c \
            -O3 -mcpu=apple-m1 -std=c++20 -ffast-math -pthread -lm \
            -o patricia
          file patricia

      - name: Smoke test
        working-directory: patricia/engine
        run: |
          out=$( (printf 'uci\nisready\nposition startpos\ngo depth 10\n'; sleep 15; printf 'quit\n') | ./patricia )
          echo "$out" | tail -5
          echo "$out" | grep -q '^id name'
          echo "$out" | grep -q '^bestmove'

      - name: Package
        run: |
          mkdir -p dist
          cp patricia/engine/patricia dist/patricia-${PATRICIA_REF}-macos-arm64
          cp patricia/LICENSE dist/LICENSE-Patricia.txt
          cat > dist/README.txt <<TXT
          Patricia ${PATRICIA_REF} (commit ${COMMIT}) for macOS on Apple Silicon.
          Built unmodified from https://github.com/Adam-Kulju/Patricia (MIT license).

          Before first use, run once in Terminal (removes the download quarantine):
            xattr -dr com.apple.quarantine /path/to/patricia-${PATRICIA_REF}-macos-arm64
            chmod +x /path/to/patricia-${PATRICIA_REF}-macos-arm64
          Then add it in JBLBase: Engines > Engine hinzufuegen > Lokal.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: Patricia-${{ env.PATRICIA_REF }}-macos-arm64
          path: dist/
          if-no-files-found: error
